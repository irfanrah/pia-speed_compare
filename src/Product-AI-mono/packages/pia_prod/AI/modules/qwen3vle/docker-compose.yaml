services:
  test-qwen3vle:
    build:
      context: ../../../../..
      dockerfile: packages/pia_prod/AI/modules/qwen3vle/Dockerfile
      args:
        BASE_IMAGE: pia-test-base:latest
    environment:
      - TEAM=ai
      - ENV=dev
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_NAMESPACE=${HF_NAMESPACE:-TeamPIA}
      - HF_AUTH_TOKEN=${HF_AUTH_TOKEN:-}
      # Point the client at the embedding_server compose service. When both
      # composes share the docker network, "qwen3vle-embedding-server" resolves
      # to that container; for `network_mode: host`, override to localhost.
      - QWEN3VLE_EMBEDDING_SERVER_URL=${QWEN3VLE_EMBEDDING_SERVER_URL:-http://localhost:8210}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ../../../../../assets/model:/workspace/assets/model:rw
      - ../../../../../assets/videos:/workspace/assets/videos:rw
    shm_size: '8g'
    network_mode: host
