# =============================================================================
# qwen3vle_trt -- Docker Compose for Isolated Test Execution
# =============================================================================
#
# Since PR #375 (aiprod-225), the pia package is embedded in the mono repo.
# No sibling repo or additional build context is needed.
#
# Prerequisites:
#   1. Build the shared base image FIRST (one-time, from Product-AI-mono root):
#
#      cd <Product-AI-mono root>
#      docker build -t pia-test-base:latest \
#          -f packages/pia_prod/AI/modules/Dockerfile .
#
# Usage:
#   cd packages/pia_prod/AI/modules/qwen3vle_trt/
#   docker compose up --build
#
#   Or run a specific test:
#   docker compose run --rm test-qwen3vle-trt \
#       python3 -m pytest \
#       packages/pia_prod/AI/tests/modules/test_qwen3vle_trt.py::test_import_module -v
#
# Cleanup:
#   docker compose down --rmi local
# =============================================================================

services:
  test-qwen3vle-trt:
    build:
      # Context = Product-AI-mono root (5 levels up from this file).
      # The .dockerignore there excludes assets/ (55GB+ model weights).
      context: ../../../../..
      dockerfile: packages/pia_prod/AI/modules/qwen3vle_trt/Dockerfile
      args:
        BASE_IMAGE: pia-test-base:latest

    # -- Environment -----------------------------------------------------------
    environment:
      - TEAM=ai
      - ENV=dev
      - NVIDIA_VISIBLE_DEVICES=all
      # HuggingFace credentials for model download (set in shell or .env file)
      - HF_NAMESPACE=${HF_NAMESPACE:-TeamPIA}
      - HF_AUTH_TOKEN=${HF_AUTH_TOKEN:-}
      # Optional: point at a running Qwen3VLE TRT FastAPI sidecar to also
      # exercise the server-level tests. Defaults match
      # packages/pia_prod/AI/modules/qwen3vle_trt/server/docker-compose.yml.
      # Tests under test_qwen3_vle_trt_server_* skip cleanly if /health is
      # unreachable, so leaving these unset is fine.
      - QWEN3VLE_TRT_API_HOST=${QWEN3VLE_TRT_API_HOST:-localhost}
      - QWEN3VLE_TRT_API_PORT=${QWEN3VLE_TRT_API_PORT:-9002}

    # -- GPU access ------------------------------------------------------------
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # -- Volume mounts ---------------------------------------------------------
    # Mount host assets/ into the container so that:
    #   1. Downloaded models (HF .onnx, .json, tokenizer/) are cached on the
    #      host and reused across container runs — avoids re-downloading.
    #   2. Downloaded test videos (NAS .mp4) are likewise cached and reused.
    #   3. TRT engines (Vision.engine, Transformer.engine, rotary_params.npz)
    #      built on first run persist for subsequent runs — building them
    #      from ONNX takes several minutes per engine.
    # Paths are relative to the build context (Product-AI-mono root).
    volumes:
      - ../../../../../assets/model:/workspace/assets/model:rw
      - ../../../../../assets/videos:/workspace/assets/videos:rw

    # -- Shared memory for PyTorch (prevents bus errors on large tensors) ------
    shm_size: '8g'

    # -- Network ---------------------------------------------------------------
    # Host network mode required to:
    #   - reach internal NAS (172.168.47.36) for test video downloads via
    #     conftest.py nas_downloader fixture
    #   - reach the Qwen3VLE TRT FastAPI sidecar at localhost:9002 (when run)
    network_mode: host
